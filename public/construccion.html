<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">

<title>Pronto, página en construcción · Casa y Cosas</title>
<link rel="icon" href="/oveja-portada.webp">
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #192c27; color: #f4ecdc; font-family: Georgia, serif }
  main { width: min(100% - 3rem, 64rem); min-height: 100svh; margin: auto; padding: clamp(2rem, 8vh, 6rem) 0; display: flex; flex-direction: column; justify-content: center }
  header { display: flex; align-items: center; gap: .65rem; padding-bottom: .9rem; border-bottom: 1px solid #536257; font: italic 1.35rem Georgia, serif }
  header img { width: 3.5rem; height: 3.5rem; margin: -.75rem; margin-right: -.55rem }
  h1 { font-weight: 400; font-size: clamp(2.8rem, 6.8vw, 5.8rem); letter-spacing: -.055em; line-height: 1.04; margin: .5em 0 .42em; text-wrap: balance }
  h1 small { display: block; color: #d1b990; font: 600 .7rem/2 system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 1rem }
  .scene { width: 100%; height: auto; display: block; border-bottom: 1px solid #657164 }
  .grazer { transform: rotate(-41deg); animation: graze 9s ease-in-out infinite }
  .drinker { transform: rotate(-5deg); animation: sip 7s ease-in-out infinite }
  .vapour { transform-box: fill-box; transform-origin: center; animation: rise 4.8s ease-out infinite }
  .second { animation-delay: -2.4s }
  .blades { transform-box: fill-box; transform-origin: center bottom; animation: breeze 6s ease-in-out infinite alternate }
  @keyframes graze {
    0%, 100% { transform: rotate(-41deg) }
    24%, 64% { transform: rotate(-56deg) }
    35%, 51% { transform: rotate(-52deg) }
    43% { transform: rotate(-55deg) }
    83% { transform: rotate(-28deg) }
  }
  @keyframes sip {
    0%, 100% { transform: rotate(1deg) }
    36%, 70% { transform: rotate(-7deg) }
  }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(3px) }
    35% { opacity: .55 }
    100% { opacity: 0; transform: translate(3px,-9px) }
  }
  @keyframes breeze { to { transform: skewX(-6deg) } }
  @media (max-width: 580px) {
    main { width: calc(100% - 2.25rem) }
    .scene { width: calc(100% + 2.25rem); margin-left: -1.125rem; height: 16rem }
  }
  @media (prefers-reduced-motion: reduce) {
    .grazer, .drinker, .vapour, .blades { animation: none }
  }
</style>
</head>
