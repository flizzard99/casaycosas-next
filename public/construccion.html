<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#192c27">
<meta name="robots" content="noindex">
<title>Pronto, página en construcción · Casa y Cosas</title>
<link rel="icon" href="/oveja-logo.png">
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #192c27; color: #f4ecdc; font-family: Georgia, serif }
  main { width: min(100% - 3rem, 64rem); min-height: 100svh; margin: auto; padding: clamp(2rem, 8vh, 6rem) 0; display: flex; flex-direction: column; justify-content: center }
  header { display: flex; align-items: center; gap: .65rem; padding-bottom: .9rem; border-bottom: 1px solid #536257; font: italic 1.35rem Georgia, serif }
  h1 { font-weight: 400; font-size: clamp(2.8rem, 6.8vw, 5.8rem); letter-spacing: -.055em; line-height: 1.04; margin: .5em 0 .42em; text-wrap: balance }
  h1 small { display: block; color: #d1b990; font: 600 .7rem/2 system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 1rem }
  .scene { width: 100%; height: auto; display: block; border-bottom: 1px solid #657164 }
  :root { color-scheme: light; --paper:#f6f1e7; --ink:#2d4135; --accent:#775c3f; --rule:#bdbba7; --sky-top:#acc3c3; --sky-middle:#f7cb9c; --sky-low:#f9e1b8; --far:#aca68a; --ridge:#929b7c; --field:#758666; --grass:#596e55 }
  :root[data-tema="oscuro"] { color-scheme: dark; --paper:#131e29; --ink:#f0eee3; --accent:#ccc09e; --rule:#475862; --sky-top:#101c36; --sky-middle:#26395a; --sky-low:#576780; --far:#46576a; --ridge:#35495b; --field:#293d46; --grass:#203238 }
  body { background:var(--paper); color:var(--ink) }
  header, .scene { border-color:var(--rule) }
  header img { width:3.75rem; height:3.75rem; object-fit:contain }
  h1 small { color:var(--accent) }
  #tema { margin-left:auto; min-height:44px; padding:5px 0; border:0; background:none; color:var(--ink); cursor:pointer }
  #tema:focus-visible { outline:2px solid currentColor; outline-offset:4px; border-radius:20px }
  .track { display:flex; width:58px; padding:3px; border-radius:30px; border:1px solid var(--rule) }
  .thumb { display:grid; place-items:center; width:26px; height:26px; background:var(--ink); color:var(--paper); border-radius:50%; transition:transform .25s ease }
  [data-tema="oscuro"] .thumb { transform:translateX(24px) }
  .night, [data-tema="oscuro"] .day { display:none }
  [data-tema="oscuro"] .night { display:inline }
  .figure { transform-box:fill-box; transform-origin:center bottom }
  [data-tema="oscuro"] .flock { filter:brightness(.85) saturate(.84) }
  .grazer { animation:graze 7s ease-in-out infinite }
  .reader { animation:read 8s ease-in-out infinite }
  .drinker { animation:sip 8.5s ease-in-out infinite }
  .vapour { transform-box: fill-box; transform-origin: center; animation: rise 4.8s ease-out infinite }
  .second { animation-delay: -2.4s }
  .blades { transform-box: fill-box; transform-origin: center bottom; animation: breeze 6s ease-in-out infinite alternate }
  @keyframes graze {
    0%, 100% { transform:translateY(0) scale(1) }
    45%, 60% { transform:translateY(2px) scale(1.006,.994) }
  }
  @keyframes read {
    0%, 100% { transform:translateY(0) }
    48%, 58% { transform:translateY(1.5px) rotate(.35deg) }
  }
  @keyframes sip {
    0%, 100% { transform:translateY(0) rotate(0) }
    42%, 62% { transform:translateY(1.5px) rotate(-.5deg) }
  }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(3px) }
    35% { opacity: .55 }
    100% { opacity: 0; transform: translate(3px,-9px) }
  }
  @keyframes breeze { to { transform: skewX(-6deg) } }
  @media (max-width: 580px) {
    main { width: calc(100% - 2.25rem) }
    .scene { width: calc(100% + 2.25rem); margin-left: -1.125rem; height: min(48vw, 16rem) }
  }
  @media (prefers-reduced-motion: reduce) {
    .grazer, .reader, .drinker, .vapour, .blades { animation: none }
    .thumb { transition:none }
  }
</style>
<script>
  const mediaTema = matchMedia('(prefers-color-scheme: dark)');
  let elegido;
  try { elegido = localStorage.getItem('cyc-tema') } catch {}
  function aplicarTema() {
    const oscuro = elegido === 'oscuro' || (elegido !== 'claro' && mediaTema.matches);
    document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
    document.querySelector('meta[name="theme-color"]').content = oscuro ? '#131e29' : '#f6f1e7';
    document.getElementById('tema')?.setAttribute('aria-checked', String(oscuro));
  }
  aplicarTema();
  mediaTema.addEventListener('change', aplicarTema);
</script>
</head>
<body>
<main>
  <header><img src="/oveja-logo.png" alt="">Casa y Cosas
    <button type="button" id="tema" role="switch" aria-label="Modo oscuro" aria-checked="false">
      <span class="track" aria-hidden="true"><span class="thumb">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <g class="day"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></g>
          <path class="night" d="M21 14A9 9 0 0 1 10 3a8 8 0 0 0 11 11Z"/>
        </svg>
      </span></span>
    </button>
  </header>
  <h1><small>Pronto,</small>página en construcción</h1>
  <svg class="scene" viewBox="0 0 900 315" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="campo">
    <title id="campo">Entre las lomas, una oveja pasta, otra lee un libro y la tercera toma mate.</title>
    <defs>
      <linearGradient id="sky" x2="0" y2="1">
        <stop style="stop-color:var(--sky-top)"/><stop offset=".58" style="stop-color:var(--sky-middle)"/><stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <radialGradient id="aureola"><stop stop-color="#fff0ae" stop-opacity=".7"/><stop offset="1" stop-color="#ffdc92" stop-opacity="0"/></radialGradient>
      <g id="tuft" fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M0 0q-3-14-12-21M1 0q-1-17 4-30M2 0q6-15 14-19M-2 0l-13-10"/>
      </g>
    </defs>
    <rect width="900" height="315" fill="url(#sky)"/>
    <g class="day"><circle cx="607" cy="111" r="108" fill="url(#aureola)"/><circle cx="607" cy="111" r="25" fill="#fff0c3"/></g>
    <g class="night" fill="#eee6cf">
      <path d="M608 36a21 21 0 1 0 22 27 20 20 0 0 1-22-27Z"/>
      <g opacity=".8"><circle cx="143" cy="39" r="1.5"/><circle cx="219" cy="71" r="1"/><circle cx="320" cy="29" r="1.3"/><circle cx="365" cy="78" r="1"/><circle cx="452" cy="50" r="1.5"/><circle cx="470" cy="41" r="1"/><circle cx="543" cy="75" r="1.1"/><circle cx="745" cy="33" r="1.5"/><circle cx="801" cy="58" r="1"/></g>
    </g>
    <path fill="var(--far)" d="M0 154q77-12 122-30l73-18q51-16 89-4l108 29q55 15 93 5l109-31q25-7 57-4l92-19q72-23 157-8v241H0Z"/>
    <path fill="var(--ridge)" d="M0 126q83 6 154 35 66 26 149 18 82-6 183-43 67-24 132-18 80 10 151-2l131-25v224H0Z"/>
    <path fill="var(--field)" d="M0 195q142-35 262-14 186 34 340-5 130-34 298-24v163H0Z"/>
    <path fill="var(--grass)" d="M0 240q163-36 311-17 165 20 313-8 164-31 276-18v118H0Z"/>
    <g fill="none" stroke="#a6ae8d" opacity=".32">
      <path d="M0 203q98-27 208-23m-173 23q66-16 116-18m292 10q79-2 139-17m96-13q132-25 222-14M0 251q110-31 213-28m382 1q119-23 231-25"/>
    </g>
    <g fill="#18281e" opacity=".25">
      <ellipse cx="290" cy="266" rx="55" ry="5"/><ellipse cx="450" cy="249" rx="40" ry="4"/><ellipse cx="594" cy="260" rx="42" ry="5"/>
    </g>
    <g class="flock">
      <image class="figure grazer" href="/oveja-pastando.webp" x="190" y="123" width="205" height="151"/>
      <image class="figure reader" href="/oveja-lectora.webp" x="392" y="138" width="116" height="116"/>
      <image class="figure drinker" href="/oveja-matera.webp" x="530" y="129" width="134" height="134"/>
      <g transform="translate(561 200)" fill="none" stroke="#f7e6c3" stroke-width="1.2">
        <path class="vapour" d="M-3-2q-5-5-1-11t-1-11"/><path class="vapour second" d="M1-3q4-5 1-10"/>
      </g>
    </g>
    <g color="#8e9b79"><g transform="translate(245 247) scale(.65)"><g class="blades"><use href="#tuft"/></g></g>
      <use href="#tuft" transform="translate(285 264) scale(.48)"/><use href="#tuft" transform="translate(618 258) scale(.44)"/>
      <use href="#tuft" transform="translate(141 280) scale(.7)"/><use href="#tuft" transform="translate(728 271) scale(.72)"/>
    </g>
  </svg>
</main>
<script>
  aplicarTema();
  document.getElementById('tema').addEventListener('click', () => {
    elegido = document.documentElement.dataset.tema === 'oscuro' ? 'claro' : 'oscuro';
    try { localStorage.setItem('cyc-tema', elegido) } catch {}
    aplicarTema();
  });
</script>
</body>
</html>
