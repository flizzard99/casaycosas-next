<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#192c27">
<meta name="robots" content="noindex">
<title>Pronto, página en construcción · Casa y Cosas</title>
<link rel="icon" href="/oveja-logo.png">
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #192c27; color: #f4ecdc; font-family: Georgia, serif }
  main { width: min(100% - 3rem, 64rem); min-height: 100svh; margin: auto; padding: clamp(2rem, 8vh, 6rem) 0; display: flex; flex-direction: column; justify-content: center }
  header { display: flex; align-items: center; gap: .65rem; padding-bottom: .9rem; border-bottom: 1px solid #536257; font: italic 1.35rem Georgia, serif }
  h1 { font-weight: 400; font-size: clamp(2.8rem, 6.8vw, 5.8rem); letter-spacing: -.055em; line-height: 1.04; margin: .5em 0 .42em; text-wrap: balance }
  h1 small { display: block; color: #d1b990; font: 600 .7rem/2 system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 1rem }
  .scene { width: 100%; height: auto; display: block; border-bottom: 1px solid #657164 }
  :root { color-scheme: light; --paper:#f6f1e7; --ink:#2d4135; --accent:#775c3f; --rule:#bdbba7; --sky-top:#acc3c3; --sky-middle:#f7cb9c; --sky-low:#f9e1b8; --far:#aca68a; --ridge:#929b7c; --field:#758666; --grass:#596e55 }
  :root[data-tema="oscuro"] { color-scheme: dark; --paper:#131e29; --ink:#f0eee3; --accent:#ccc09e; --rule:#475862; --sky-top:#101c36; --sky-middle:#26395a; --sky-low:#576780; --far:#46576a; --ridge:#35495b; --field:#293d46; --grass:#203238 }
  body { background:var(--paper); color:var(--ink) }
  header, .scene { border-color:var(--rule) }
  header img { width:3.75rem; height:3.75rem; object-fit:contain }
  h1 small { color:var(--accent) }
  .controls { margin-left:auto; display:flex; align-items:center; gap:.45rem }
  .toggle { min-height:44px; padding:5px 0; border:0; background:none; color:var(--ink); cursor:pointer }
  .toggle:focus-visible { outline:2px solid currentColor; outline-offset:3px; border-radius:20px }
  .cursor-button { width:38px; height:38px; display:grid; place-items:center; padding:0; border:1px solid var(--rule); border-radius:50%; background:transparent; color:var(--ink); cursor:pointer; transition:background .2s ease, color .2s ease, border-color .2s ease, box-shadow .25s ease, transform .2s ease }
  .cursor-button:hover { transform:translateY(-1px) }
  .cursor-button:focus-visible { outline:2px solid currentColor; outline-offset:3px }
  [data-seguidor="true"] .cursor-button { background:var(--ink); color:var(--paper); border-color:var(--ink); box-shadow:0 0 0 3px rgba(119,92,63,.14), 0 0 18px rgba(119,92,63,.5) }
  [data-tema="oscuro"][data-seguidor="true"] .cursor-button { box-shadow:0 0 0 3px rgba(204,192,158,.14), 0 0 20px rgba(204,192,158,.48) }
  .track { display:flex; width:58px; padding:3px; border-radius:30px; border:1px solid var(--rule) }
  .theme-thumb { display:grid; place-items:center; width:26px; height:26px; background:var(--ink); color:var(--paper); border-radius:50%; transition:transform .25s ease }
  [data-tema="oscuro"] .theme-thumb { transform:translateX(24px) }
  .night, [data-tema="oscuro"] .day { display:none }
  [data-tema="oscuro"] .night { display:inline }
  [data-tema="oscuro"] .flock { filter:brightness(.85) saturate(.84) }
  .cloud { fill:#fff9ed; opacity:.28; animation:cloud-drift 20s linear infinite; will-change:transform }
  .cloud-a { animation-duration:17s; animation-delay:-2s }
  .cloud-b { animation-duration:22s; animation-delay:-8s; opacity:.2 }
  .cloud-c { animation-duration:26s; animation-delay:-15s; opacity:.16 }
  .cloud-d { animation-duration:19s; animation-delay:-16s; opacity:.22 }
  .stars { filter:drop-shadow(0 0 2px rgba(255,247,210,.75)) }
  .stars circle { opacity:.4; transform-box:fill-box; transform-origin:center }
  [data-tema="oscuro"] .cloud { animation:none }
  [data-tema="oscuro"] .stars circle { animation:twinkle 2.8s ease-in-out infinite }
  [data-tema="oscuro"] .stars circle:nth-child(3n+1) { animation-delay:-1.4s; animation-duration:2.1s }
  [data-tema="oscuro"] .stars circle:nth-child(3n+2) { animation-delay:-2.2s; animation-duration:3.5s }
  @keyframes cloud-drift {
    from { transform:translateX(-190px) }
    to { transform:translateX(930px) }
  }
  @keyframes twinkle {
    0%, 100% { opacity:.28; transform:scale(.78) }
    50% { opacity:1; transform:scale(1.24) }
  }
  #cursor-pasto, #cursor-oveja { position:fixed; left:0; top:0; z-index:9999; pointer-events:none; opacity:0; will-change:transform; transition:opacity .18s ease; contain:layout paint }
  #cursor-pasto { width:28px; height:28px; color:#66824a; filter:drop-shadow(0 3px 2px rgba(25,47,35,.2)) }
  #cursor-pasto svg, #cursor-oveja img { display:block; width:100%; height:100% }
  #cursor-oveja { width:62px; height:65px; filter:drop-shadow(0 5px 4px rgba(25,47,35,.22)) }
  #cursor-oveja img { object-fit:contain; transform-origin:center }
  #cursor-oveja[data-direccion="derecha"] img { transform:scaleX(-1) }
  [data-tema="oscuro"] #cursor-pasto { color:#a6bf75; filter:drop-shadow(0 0 5px rgba(181,213,126,.42)) }
  [data-puntero="visible"] #cursor-pasto, [data-puntero="visible"] #cursor-oveja { opacity:1 }
  @media (hover:hover) and (pointer:fine) {
    html[data-seguidor="true"][data-puntero="visible"], html[data-seguidor="true"][data-puntero="visible"] * { cursor:none !important }
  }
  @media (max-width: 580px) {
    main { width: calc(100% - 2.25rem) }
    .scene { width: calc(100% + 2.25rem); margin-left: -1.125rem; height: min(48vw, 16rem) }
  }
  @media (hover:none), (pointer:coarse) {
    #seguidor, #cursor-pasto, #cursor-oveja { display:none }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud, [data-tema="oscuro"] .stars circle { animation:none }
    .theme-thumb, .cursor-button { transition:none }
    #seguidor, #cursor-pasto, #cursor-oveja { display:none }
  }
</style>
<script>
  const mediaTema = matchMedia('(prefers-color-scheme: dark)');
  const mediaPuntero = matchMedia('(hover:hover) and (pointer:fine)');
  const mediaMovimiento = matchMedia('(prefers-reduced-motion: reduce)');
  let elegido;
  let seguidorActivo = true;
  try { elegido = localStorage.getItem('cyc-tema') } catch {}
  try { seguidorActivo = localStorage.getItem('cyc-seguidor') !== 'off' } catch {}
  function aplicarTema() {
    const oscuro = elegido === 'oscuro' || (elegido !== 'claro' && mediaTema.matches);
    document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
    document.querySelector('meta[name="theme-color"]').content = oscuro ? '#131e29' : '#f6f1e7';
    document.getElementById('tema')?.setAttribute('aria-checked', String(oscuro));
  }
  function aplicarSeguidor() {
    document.documentElement.dataset.seguidor = String(seguidorActivo);
    document.getElementById('seguidor')?.setAttribute('aria-pressed', String(seguidorActivo));
    if (!seguidorActivo || !mediaPuntero.matches || mediaMovimiento.matches) ocultarSeguidor();
  }
  function ocultarSeguidor() {
    delete document.documentElement.dataset.puntero;
  }
  aplicarTema();
  aplicarSeguidor();
  mediaTema.addEventListener('change', aplicarTema);
  mediaPuntero.addEventListener('change', aplicarSeguidor);
  mediaMovimiento.addEventListener('change', aplicarSeguidor);
</script>
</head>
<body>
<main>
  <header><img src="/oveja-logo.png" alt="">Casa y Cosas
    <div class="controls">
    <button type="button" id="seguidor" class="cursor-button" aria-label="Oveja siguiendo el cursor" aria-pressed="true">
      <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 19c1-4 3-7 6-10m-1 10c0-5 2-9 6-13m-1 13c1-4 2-6 5-8M4 19h16"/>
      </svg>
    </button>
    <button type="button" id="tema" class="toggle" role="switch" aria-label="Modo oscuro" aria-checked="false">
      <span class="track" aria-hidden="true"><span class="theme-thumb">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <g class="day"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></g>
          <path class="night" d="M21 14A9 9 0 0 1 10 3a8 8 0 0 0 11 11Z"/>
        </svg>
      </span></span>
    </button>
    </div>
  </header>
  <h1><small>Pronto,</small>página en construcción</h1>
  <svg class="scene" viewBox="0 0 900 315" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Entre las lomas, una oveja pasta, otra lee un libro y la tercera toma mate.">
    <defs>
      <linearGradient id="sky" x2="0" y2="1">
        <stop style="stop-color:var(--sky-top)"/><stop offset=".58" style="stop-color:var(--sky-middle)"/><stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <radialGradient id="aureola"><stop stop-color="#fff0ae" stop-opacity=".7"/><stop offset="1" stop-color="#ffdc92" stop-opacity="0"/></radialGradient>
      <g id="cloud-shape">
        <path d="M16 34c5-14 23-18 35-8 9-15 34-17 46-2 17-5 35 4 39 21H0c1-7 7-10 16-11Z"/>
      </g>
      <g id="tuft" fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M0 0q-3-14-12-21M1 0q-1-17 4-30M2 0q6-15 14-19M-2 0l-13-10"/>
      </g>
    </defs>
    <rect width="900" height="315" fill="url(#sky)"/>
    <g class="day cloud cloud-a"><use href="#cloud-shape" transform="translate(0 18) scale(1.02)"/></g>
    <g class="day cloud cloud-b"><use href="#cloud-shape" transform="translate(0 62) scale(.7)"/></g>
    <g class="day cloud cloud-c"><use href="#cloud-shape" transform="translate(0 35) scale(.52)"/></g>
    <g class="day cloud cloud-d"><use href="#cloud-shape" transform="translate(0 90) scale(.84)"/></g>
    <g class="day"><circle cx="607" cy="111" r="108" fill="url(#aureola)"/><circle cx="607" cy="111" r="25" fill="#fff0c3"/></g>
    <g class="night" fill="#eee6cf">
      <path d="M608 36a21 21 0 1 0 22 27 20 20 0 0 1-22-27Z"/>
      <g class="stars"><circle cx="55" cy="48" r="1.6"/><circle cx="96" cy="83" r="1.2"/><circle cx="143" cy="39" r="2"/><circle cx="183" cy="103" r="1"/><circle cx="219" cy="71" r="1.4"/><circle cx="272" cy="48" r="1"/><circle cx="305" cy="94" r="1.6"/><circle cx="320" cy="29" r="1.8"/><circle cx="365" cy="78" r="1.3"/><circle cx="410" cy="31" r="1"/><circle cx="452" cy="58" r="2"/><circle cx="510" cy="99" r="1.2"/><circle cx="543" cy="75" r="1.6"/><circle cx="665" cy="39" r="1.1"/><circle cx="690" cy="91" r="1.3"/><circle cx="745" cy="33" r="2.1"/><circle cx="771" cy="111" r="1"/><circle cx="801" cy="67" r="1.5"/><circle cx="845" cy="40" r="1.2"/><circle cx="866" cy="95" r="1.8"/></g>
    </g>
    <path fill="var(--far)" d="M0 154q77-12 122-30l73-18q51-16 89-4l108 29q55 15 93 5l109-31q25-7 57-4l92-19q72-23 157-8v241H0Z"/>
    <path fill="var(--ridge)" d="M0 126q83 6 154 35 66 26 149 18 82-6 183-43 67-24 132-18 80 10 151-2l131-25v224H0Z"/>
    <path fill="var(--field)" d="M0 195q142-35 262-14 186 34 340-5 130-34 298-24v163H0Z"/>
    <path fill="var(--grass)" d="M0 240q163-36 311-17 165 20 313-8 164-31 276-18v118H0Z"/>
    <g fill="none" stroke="#a6ae8d" opacity=".32">
      <path d="M0 203q98-27 208-23m-173 23q66-16 116-18m292 10q79-2 139-17m96-13q132-25 222-14M0 251q110-31 213-28m382 1q119-23 231-25"/>
    </g>
    <g fill="#18281e" opacity=".25">
      <ellipse cx="290" cy="264" rx="43" ry="4"/><ellipse cx="450" cy="249" rx="40" ry="4"/><ellipse cx="594" cy="260" rx="42" ry="5"/>
    </g>
    <g class="flock">
      <image href="/oveja-pastando.webp" x="218" y="151" width="158" height="116"/>
      <image href="/oveja-lectora.webp" x="392" y="138" width="116" height="116"/>
      <image href="/oveja-matera.webp" x="530" y="129" width="134" height="134"/>
    </g>
    <g color="#8e9b79"><g transform="translate(245 247) scale(.65)"><use href="#tuft"/></g>
      <use href="#tuft" transform="translate(285 264) scale(.48)"/><use href="#tuft" transform="translate(618 258) scale(.44)"/>
      <use href="#tuft" transform="translate(141 280) scale(.7)"/><use href="#tuft" transform="translate(728 271) scale(.72)"/>
    </g>
  </svg>
</main>
<div id="cursor-pasto" aria-hidden="true">
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 28h24M10 27C9 18 7 13 4 9m10 18c0-11 2-18 6-23m-4 23c2-8 6-13 11-16M8 20c3-1 5 0 7 2m3-6c3-2 5-2 8-1"/>
  </svg>
</div>
<div id="cursor-oveja" aria-hidden="true"><img src="/oveja-logo.png" alt=""></div>
<script>
  aplicarTema();
  aplicarSeguidor();
  document.getElementById('tema').addEventListener('click', () => {
    elegido = document.documentElement.dataset.tema === 'oscuro' ? 'claro' : 'oscuro';
    try { localStorage.setItem('cyc-tema', elegido) } catch {}
    aplicarTema();
  });
  document.getElementById('seguidor').addEventListener('click', () => {
    seguidorActivo = !seguidorActivo;
    try { localStorage.setItem('cyc-seguidor', seguidorActivo ? 'on' : 'off') } catch {}
    aplicarSeguidor();
  });

  const pastoCursor = document.getElementById('cursor-pasto');
  const ovejaCursor = document.getElementById('cursor-oveja');
  let cursorX = 0;
  let cursorY = 0;
  let ovejaX = 0;
  let ovejaY = 0;
  let seguidorIniciado = false;
  let cuadroSeguidor = 0;

  function animarSeguidor() {
    cuadroSeguidor = 0;
    if (!seguidorActivo || !mediaPuntero.matches || mediaMovimiento.matches) return;
    const distanciaX = cursorX - ovejaX;
    const distanciaY = cursorY - ovejaY;
    const distancia = Math.hypot(distanciaX, distanciaY) || 1;
    const objetivoX = cursorX - distanciaX / distancia * 68;
    const objetivoY = cursorY - distanciaY / distancia * 68;
    ovejaX += (objetivoX - ovejaX) * .14;
    ovejaY += (objetivoY - ovejaY) * .14;
    ovejaCursor.style.transform = `translate3d(${ovejaX - 31}px,${ovejaY - 33}px,0)`;
    ovejaCursor.dataset.direccion = cursorX < ovejaX ? 'izquierda' : 'derecha';
    if (Math.abs(objetivoX - ovejaX) > .08 || Math.abs(objetivoY - ovejaY) > .08) {
      cuadroSeguidor = requestAnimationFrame(animarSeguidor);
    }
  }

  document.addEventListener('pointermove', event => {
    if (event.pointerType !== 'mouse' || !seguidorActivo || !mediaPuntero.matches || mediaMovimiento.matches) return;
    cursorX = event.clientX;
    cursorY = event.clientY;
    pastoCursor.style.transform = `translate3d(${cursorX - 14}px,${cursorY - 21}px,0)`;
    if (!seguidorIniciado) {
      ovejaX = cursorX - 74;
      ovejaY = cursorY + 18;
      seguidorIniciado = true;
    }
    document.documentElement.dataset.puntero = 'visible';
    if (!cuadroSeguidor) cuadroSeguidor = requestAnimationFrame(animarSeguidor);
  }, { passive:true });

  window.addEventListener('mouseout', event => {
    if (!event.relatedTarget) ocultarSeguidor();
  });
</script>
</body>
</html>
